<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#bfe0f4" />
    <title>空中之島</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main id="game" aria-label="空中之島遊戲">
      <div id="hud">
        <div class="brand">空中之島</div>
        <div class="controls">WASD 移動・空白鍵跳躍・滑鼠轉向</div>
        <div id="fps" aria-live="off">-- FPS</div>
      </div>
      <div id="crosshair" aria-hidden="true">+</div>
      <button id="start" type="button">點擊畫面開始</button>
      <div id="error" role="alert" hidden></div>
    </main>
  </body>
</html>
