<!doctype html>
<html lang="zh-Hant">

    <meta charset="utf-8" />

    <meta name="theme-color" content="#bfe0f4" />
    <title>空中之島</title>
    <style>
* { box-sizing: border-box; }

html, body, #game {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #bfe0f4;
  color: #fff;
  font-family: system-ui, "Microsoft JhengHei", sans-serif;
}

#game { position: relative; }
canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute;
  z-index: 2;
  inset: 18px 20px auto;
  display: flex;
  align-items: center;
  gap: 18px;
  text-shadow: 0 1px 4px #193246;
  pointer-events: none;
}

.brand { font-size: 18px; font-weight: 750; }
.controls, #fps { font-size: 13px; }
#fps { margin-left: auto; font-variant-numeric: tabular-nums; }

#crosshair {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -54%);
  color: white;
  font: 24px/1 monospace;
  text-shadow: 0 1px 3px #172b3a;
  pointer-events: none;
}

#start {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  transform: translate(-50%, 34px);
  border: 1px solid rgb(255 255 255 / 70%);
  border-radius: 999px;
  padding: 11px 20px;
  color: white;
  background: rgb(21 43 57 / 70%);
  font: inherit;
  cursor: pointer;
}

#start[hidden], #error[hidden] { display: none; }
#error { position: absolute; z-index: 5; inset: auto 16px 16px; color: #fff; background: #842e2e; padding: 12px; }

@media (max-width: 600px) {
  #hud { inset: 12px; align-items: flex-start; flex-wrap: wrap; gap: 8px 14px; }
  .controls { order: 3; width: 100%; }
}

</style>

const WORLD_LIMIT = 32;
const PLAYER_EYE_HEIGHT = 2;

function isWithinWorldBounds(x, y, z) {
  const half = WORLD_LIMIT / 2;
  return [x, y, z].every((value) => Number.isFinite(value) && value >= -half && value < half);
}

function createIslandBlocks() {
  const blocks = [];
  const layers = [
    { y: 0, width: 16, type: 'grass' },
    { y: -1, width: 12, type: 'dirt' },
    { y: -2, width: 8, type: 'dirt' },
    { y: -3, width: 4, type: 'stone' },
  ];

  for (const { y, width, type } of layers) {
    const start = -width / 2;
    for (let x = start; x < start + width; x += 1) {
      for (let z = start; z < start + width; z += 1) {
        blocks.push({ x, y, z, type });
      }
    }
  }

  return blocks;
}

function findSpawnPoint() {
  return { x: 0, y: 0.5 + PLAYER_EYE_HEIGHT, z: 0 };
}


function stepVerticalPhysics({
  blocks,
  x,
  z,
  eyeY,
  verticalSpeed,
  delta,
  eyeHeight = PLAYER_EYE_HEIGHT,
  gravity = 19,
}) {
  const currentFeetY = eyeY - eyeHeight;
  const nextVerticalSpeed = verticalSpeed - gravity * delta;
  const nextEyeY = eyeY + nextVerticalSpeed * delta;
  const nextFeetY = nextEyeY - eyeHeight;

  if (nextVerticalSpeed <= 0) {
    const landingTop = blocks.reduce((highest, block) => {
      const top = block.y + 0.5;
      const overlapsX = x >= block.x - 0.5 && x <= block.x + 0.5;
      const overlapsZ = z >= block.z - 0.5 && z <= block.z + 0.5;
      const crossesTop = top <= currentFeetY + 1e-6 && top >= nextFeetY - 1e-6;
      return overlapsX && overlapsZ && crossesTop ? Math.max(highest, top) : highest;
    }, -Infinity);

    if (Number.isFinite(landingTop)) {
      return { eyeY: landingTop + eyeHeight, verticalSpeed: 0, grounded: true };
    }
  }

  return { eyeY: nextEyeY, verticalSpeed: nextVerticalSpeed, grounded: false };
}

function respawnIfInVoid({ eyeY, verticalSpeed, spawn, voidY = -12 }) {
  if (eyeY >= voidY) return { eyeY, verticalSpeed, respawned: false };
  return { eyeY: spawn.y, verticalSpeed: 0, respawned: true };
}

function restoreWorldIfEmpty(blocks) {
  return blocks.length === 0 ? createIslandBlocks() : blocks;
}

function beginGame(onStart, requestPointerLock) {
  onStart();

  try {
    const result = requestPointerLock?.();
    if (result && typeof result.catch === 'function') result.catch(() => {});
  } catch {
    // 指標鎖定只是視角控制的輔助；瀏覽器拒絕時仍可開始遊戲。
  }
}

function shouldStartJump(keys, grounded) {
  return grounded && keys.has('Space');
}

function getMovementInput(keys) {
  return {
    forward: Number(keys.has('KeyW') || keys.has('ArrowUp')) -
      Number(keys.has('KeyS') || keys.has('ArrowDown')),
    sideways: Number(keys.has('KeyD') || keys.has('ArrowRight')) -
      Number(keys.has('KeyA') || keys.has('ArrowLeft')),
  };
}

const MINING_DURATIONS = Object.freeze({ grass: 0.8, dirt: 0.8, stone: 2 });

function getMiningDuration(type) {
  return MINING_DURATIONS[type] ?? MINING_DURATIONS.dirt;
}

function createMiningController() {
  let target = null;
  let elapsed = 0;

  return {
    update({ target: nextTarget, held, delta, type }) {
      if (!held || nextTarget == null) {
        target = null;
        elapsed = 0;
        return { target: null, progress: 0, stage: null, mined: false };
      }

      if (nextTarget !== target) {
        target = nextTarget;
        elapsed = 0;
      }

      const duration = getMiningDuration(type);
      elapsed = Math.min(elapsed + Math.max(0, delta), duration);
      const progress = elapsed / duration;
      return {
        target,
        progress,
        stage: Math.min(9, Math.floor(progress * 10)),
        mined: progress >= 1,
      };
    },
  };
}


const game = document.querySelector('#game');
const startButton = document.querySelector('#start');
const errorBox = document.querySelector('#error');
const fpsLabel = document.querySelector('#fps');

try {
  startGame();
} catch (error) {
  errorBox.hidden = false;
  errorBox.textContent = `遊戲載入失敗：${error.message}`;
  throw error;
}

function startGame() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#bfe0f4');

  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 100);
  const spawn = findSpawnPoint();
  camera.position.set(spawn.x, spawn.y, spawn.z);

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  game.prepend(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xe8f6ff, 0x68604e, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-8, 18, 10);
  scene.add(sun);

  const loader = new THREE.TextureLoader();
  const texture = (name) => {
    const map = loader.load(INLINE_TEXTURES[name]);
    map.colorSpace = THREE.SRGBColorSpace;
    map.magFilter = THREE.NearestFilter;
    map.minFilter = THREE.NearestFilter;
    return map;
  };
  const grassTop = texture('grass_top');
  const grassSide = texture('grass_side');
  const dirt = texture('dirt');
  const stone = texture('stone');
  const grassMaterials = [
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassTop }),
    new THREE.MeshLambertMaterial({ map: dirt }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
  ];
  const materials = {
    grass: grassMaterials,
    dirt: new THREE.MeshLambertMaterial({ map: dirt }),
    stone: new THREE.MeshLambertMaterial({ map: stone }),
  };

  const blocks = createIslandBlocks();
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const transform = new THREE.Object3D();
  const blockMeshes = [];
  for (const type of ['grass', 'dirt', 'stone']) {
    const positions = blocks.filter((block) => block.type === type);
    const mesh = new THREE.InstancedMesh(geometry, materials[type], positions.length);
    positions.forEach((block, index) => {
      transform.position.set(block.x, block.y, block.z);
      transform.updateMatrix();
      mesh.setMatrixAt(index, transform.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.userData.blockPositions = positions;
    mesh.userData.blockPositionsType = type;
    blockMeshes.push(mesh);
    scene.add(mesh);
  }

  const crackMaterials = Array.from({ length: 10 }, (_, stage) => {
    const map = texture(`destroy_stage_${stage}`);
    return new THREE.MeshBasicMaterial({
      map,
      transparent: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
    });
  });
  const crackOverlay = new THREE.Mesh(new THREE.BoxGeometry(1.006, 1.006, 1.006), crackMaterials);
  crackOverlay.visible = false;
  scene.add(crackOverlay);
  const raycaster = new THREE.Raycaster();
  const screenCenter = new THREE.Vector2(0, 0);
  const mining = createMiningController();

  const keys = new Set();
  let yaw = 0;
  let pitch = 0;
  let verticalSpeed = 0;
  let grounded = true;
  let gameStarted = false;
  let miningHeld = false;
  let lastTime = performance.now();
  let fpsFrames = 0;
  let fpsStart = lastTime;
  const eyeHeight = PLAYER_EYE_HEIGHT;

  window.addEventListener('keydown', (event) => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
    keys.add(event.code);
  });
  window.addEventListener('keyup', (event) => keys.delete(event.code));
  window.addEventListener('blur', () => {
    keys.clear();
    miningHeld = false;
  });
  renderer.domElement.addEventListener('mousedown', (event) => {
    if (event.button === 0) miningHeld = true;
  });
  window.addEventListener('mouseup', (event) => {
    if (event.button === 0) miningHeld = false;
  });

  const enterGame = () => beginGame(
    () => {
      gameStarted = true;
      startButton.hidden = true;
    },
    () => {
      if (document.pointerLockElement !== renderer.domElement) {
        return renderer.domElement.requestPointerLock?.();
      }
      return undefined;
    },
  );
  renderer.domElement.addEventListener('click', enterGame);
  startButton.addEventListener('click', enterGame);
  document.addEventListener('mousemove', (event) => {
    const isPointerLocked = document.pointerLockElement === renderer.domElement;
    if (!gameStarted || (!isPointerLocked && event.target !== renderer.domElement)) return;
    yaw -= event.movementX * 0.002;
    pitch = THREE.MathUtils.clamp(pitch - event.movementY * 0.002, -1.45, 1.45);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
  });

  function updatePlayer(delta) {
    if (shouldStartJump(keys, grounded)) {
      verticalSpeed = 7.1;
      grounded = false;
    }
    const { forward, sideways } = getMovementInput(keys);
    const length = Math.hypot(forward, sideways) || 1;
    const speed = 5.2 * delta / length;
    const nextX = camera.position.x + (sideways * Math.cos(yaw) - forward * Math.sin(yaw)) * speed;
    const nextZ = camera.position.z + (-sideways * Math.sin(yaw) - forward * Math.cos(yaw)) * speed;
    camera.position.x = THREE.MathUtils.clamp(nextX, -15.5, 15.5);
    camera.position.z = THREE.MathUtils.clamp(nextZ, -15.5, 15.5);

    const physics = stepVerticalPhysics({
      blocks: blockMeshes.flatMap((mesh) => mesh.userData.blockPositions),
      x: camera.position.x,
      z: camera.position.z,
      eyeY: camera.position.y,
      verticalSpeed,
      delta,
      eyeHeight,
    });
    camera.position.y = physics.eyeY;
    verticalSpeed = physics.verticalSpeed;
    grounded = physics.grounded;

    const respawn = respawnIfInVoid({
      eyeY: camera.position.y,
      verticalSpeed,
      spawn,
    });
    if (respawn.respawned) {
      camera.position.set(spawn.x, respawn.eyeY, spawn.z);
      verticalSpeed = respawn.verticalSpeed;
      grounded = true;
    }
  }

  function updateMining(delta) {
    raycaster.setFromCamera(screenCenter, camera);
    const hit = miningHeld && gameStarted
      ? raycaster.intersectObjects(blockMeshes, false)[0]
      : null;
    const mesh = hit?.object ?? null;
    const instanceId = hit?.instanceId;
    const block = mesh && Number.isInteger(instanceId)
      ? mesh.userData.blockPositions[instanceId]
      : null;
    const result = mining.update({
      target: block ? `${block.x},${block.y},${block.z}` : null,
      held: miningHeld && gameStarted,
      delta,
      type: block?.type,
    });

    if (!block || result.stage == null) {
      crackOverlay.visible = false;
      return;
    }

    crackOverlay.position.set(block.x, block.y, block.z);
    crackOverlay.material = crackMaterials[result.stage];
    crackOverlay.visible = true;
    if (result.mined) {
      const positions = mesh.userData.blockPositions;
      const lastIndex = positions.length - 1;
      if (instanceId !== lastIndex) {
        const lastBlock = positions[lastIndex];
        transform.position.set(lastBlock.x, lastBlock.y, lastBlock.z);
        transform.updateMatrix();
        mesh.setMatrixAt(instanceId, transform.matrix);
        positions[instanceId] = lastBlock;
      }
      positions.pop();
      mesh.count = positions.length;
      mesh.instanceMatrix.needsUpdate = true;
      mesh.computeBoundingSphere();
      crackOverlay.visible = false;
      mining.update({ target: null, held: false, delta: 0, type: block.type });
      if (blockMeshes.every((blockMesh) => blockMesh.userData.blockPositions.length === 0)) {
        const restored = restoreWorldIfEmpty([]);
        for (const blockMesh of blockMeshes) {
          const positions = restored.filter((restoredBlock) => restoredBlock.type === blockMesh.userData.blockPositionsType);
          blockMesh.userData.blockPositions.splice(0, blockMesh.userData.blockPositions.length, ...positions);
          positions.forEach((restoredBlock, index) => {
            transform.position.set(restoredBlock.x, restoredBlock.y, restoredBlock.z);
            transform.updateMatrix();
            blockMesh.setMatrixAt(index, transform.matrix);
          });
          blockMesh.count = positions.length;
          blockMesh.instanceMatrix.needsUpdate = true;
          blockMesh.computeBoundingSphere();
        }
        camera.position.set(spawn.x, spawn.y, spawn.z);
        verticalSpeed = 0;
        grounded = true;
      }
    }
  }

  function animate(now) {
    requestAnimationFrame(animate);
    const delta = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    updatePlayer(delta);
    updateMining(delta);
    renderer.render(scene, camera);
    fpsFrames += 1;
    if (now - fpsStart >= 1000) {
      fpsLabel.textContent = `${Math.round(fpsFrames * 1000 / (now - fpsStart))} FPS`;
      fpsFrames = 0;
      fpsStart = now;
    }
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

    </script>
  </body>
</html>
