<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#bfe0f4" />
    <title>空中之島</title>
    <style>
* { box-sizing: border-box; }

html, body, #game {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #bfe0f4;
  color: #fff;
  font-family: system-ui, "Microsoft JhengHei", sans-serif;
}

#game { position: relative; }
canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute;
  z-index: 2;
  inset: 18px 20px auto;
  display: flex;
  align-items: center;
  gap: 18px;
  text-shadow: 0 1px 4px #193246;
  pointer-events: none;
}

.brand { font-size: 18px; font-weight: 750; }
.controls, #fps { font-size: 13px; }
#fps { margin-left: auto; font-variant-numeric: tabular-nums; }

#crosshair {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -54%);
  color: white;
  font: 24px/1 monospace;
  text-shadow: 0 1px 3px #172b3a;
  pointer-events: none;
}

#inventory {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: grid;
  width: min(560px, calc(100% - 24px));
  grid-template-columns: repeat(8, minmax(44px, 1fr));
  gap: 8px;
  pointer-events: none;
}

.inventory-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 52px;
  padding: 4px;
  border: 1px solid rgb(255 255 255 / 55%);
  border-radius: 8px;
  background: rgb(20 38 51 / 78%);
  box-shadow: 0 2px 8px rgb(0 0 0 / 24%);
  text-shadow: 0 1px 3px #193246;
}

.inventory-slot.selected {
  border-color: #ffe66d;
  outline: 3px solid #ffe66d;
  box-shadow: 0 0 14px rgb(255 230 109 / 85%);
  transform: translateY(-4px);
}

.inventory-slot span:last-child {
  font-size: 15px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.inventory-icon {
  width: 26px;
  height: 26px;
  image-rendering: pixelated;
  object-fit: contain;
}

#start {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  transform: translate(-50%, 34px);
  border: 1px solid rgb(255 255 255 / 70%);
  border-radius: 999px;
  padding: 11px 20px;
  color: white;
  background: rgb(21 43 57 / 70%);
  font: inherit;
  cursor: pointer;
}

#start[hidden], #error[hidden] { display: none; }
#error { position: absolute; z-index: 5; inset: auto 16px 16px; color: #fff; background: #842e2e; padding: 12px; }

@media (max-width: 600px) {
  #hud { inset: 12px; align-items: flex-start; flex-wrap: wrap; gap: 8px 14px; }
  .controls { order: 3; width: 100%; }
  #inventory { bottom: 12px; grid-template-columns: repeat(8, minmax(32px, 1fr)); gap: 3px; }
  .inventory-slot { min-height: 46px; padding: 3px 1px; }
  .inventory-icon { width: 22px; height: 22px; }
  .inventory-slot span:last-child { font-size: 13px; }
}

</style>

  </head>

const WORLD_LIMIT = 32;
const PLAYER_EYE_HEIGHT = 2;
const CAMERA_VIEW_OFFSET = 0.15;
const BLOCK_TYPES = Object.freeze([
  'grass', 'dirt', 'stone', 'sand', 'brick', 'planks', 'log', 'leaves',
]);

const DEFAULT_WORLD_SEED = 0x51a17;
const WORLD_BOTTOM = -10;

function isWithinWorldBounds(x, y, z) {
  const half = WORLD_LIMIT / 2;
  return [x, y, z].every((value) => Number.isFinite(value) && value >= -half && value < half);
}

function hashNoise(x, z, seed, salt = 0) {
  let value = Math.imul(x + salt, 0x1f123bb5) ^ Math.imul(z - salt, 0x5f356495) ^ seed;
  value = Math.imul(value ^ (value >>> 15), 0x2c1b3c6d);
  value = Math.imul(value ^ (value >>> 12), 0x297a2d39);
  return ((value ^ (value >>> 15)) >>> 0) / 0xffffffff;
}

function smoothNoise(x, z, seed, salt = 0) {
  const x0 = Math.floor(x);
  const z0 = Math.floor(z);
  const tx = x - x0;
  const tz = z - z0;
  const smoothX = tx * tx * (3 - 2 * tx);
  const smoothZ = tz * tz * (3 - 2 * tz);
  const top = hashNoise(x0, z0, seed, salt) * (1 - smoothX) +
    hashNoise(x0 + 1, z0, seed, salt) * smoothX;
  const bottom = hashNoise(x0, z0 + 1, seed, salt) * (1 - smoothX) +
    hashNoise(x0 + 1, z0 + 1, seed, salt) * smoothX;
  return top * (1 - smoothZ) + bottom * smoothZ;
}

function terrainHeight(x, z, seed) {
  if (Math.abs(x) <= 2 && Math.abs(z) <= 2) return 0;
  const broad = smoothNoise(x / 4, z / 4, seed, 17) - 0.5;
  const detail = smoothNoise(x / 1.8, z / 1.8, seed, 43) - 0.5;
  const edge = Math.max(Math.abs(x), Math.abs(z));
  return Math.round(1 + broad * 6 + detail * 2 - edge * 0.15);
}

function createIslandBlocks(seed = DEFAULT_WORLD_SEED) {
  const worldSeed = Number.isFinite(seed) ? seed >>> 0 : DEFAULT_WORLD_SEED;
  const blocks = [];
  const occupied = new Map();
  const surfaces = new Map();
  const columnKey = (x, z) => `${x},${z}`;
  const blockKey = (x, y, z) => `${x},${y},${z}`;
  const addBlock = (x, y, z, type) => {
    if (!isWithinWorldBounds(x, y, z)) return false;
    const key = blockKey(x, y, z);
    if (occupied.has(key)) return false;
    const block = { x, y, z, type };
    blocks.push(block);
    occupied.set(key, type);
    return true;
  };

  for (let x = -10; x <= 10; x += 1) {
    for (let z = -10; z <= 10; z += 1) {
      const edge = Math.max(Math.abs(x), Math.abs(z));
      const edgeLimit = 7 + smoothNoise(x / 2.7, z / 2.7, worldSeed, 71) * 2;
      if (edge > edgeLimit) continue;

      const topY = terrainHeight(x, z, worldSeed);
      surfaces.set(columnKey(x, z), topY);
      const shore = edge >= 6 && topY <= 1 && hashNoise(x, z, worldSeed, 101) > 0.28;
      const rockyOutcrop = hashNoise(x, z, worldSeed, 131) > 0.975;

      for (let y = WORLD_BOTTOM; y <= topY; y += 1) {
        let type;
        if (y === WORLD_BOTTOM || y <= topY - 4 || (y === topY - 2 && hashNoise(x, z, worldSeed, y) > 0.96)) {
          type = 'stone';
        } else if (y === topY) {
          type = rockyOutcrop ? 'stone' : shore ? 'sand' : 'grass';
        } else if (shore && y >= topY - 1) {
          type = 'sand';
        } else {
          type = 'dirt';
        }
        addBlock(x, y, z, type);
      }
    }
  }

  const buildingCenter = { x: -4, z: 4 };
  const treeCandidates = [];
  for (const [key, topY] of surfaces) {
    const [x, z] = key.split(',').map(Number);
    if (Math.abs(x) <= 3 && Math.abs(z) <= 3) continue;
    if (Math.abs(x - buildingCenter.x) <= 3 && Math.abs(z - buildingCenter.z) <= 3) continue;
    if (occupied.get(blockKey(x, topY, z)) !== 'grass') continue;
    const neighbors = [
      surfaces.get(columnKey(x + 1, z)), surfaces.get(columnKey(x - 1, z)),
      surfaces.get(columnKey(x, z + 1)), surfaces.get(columnKey(x, z - 1)),
    ];
    if (neighbors.every((height) => height != null && Math.abs(height - topY) <= 1)) {
      treeCandidates.push({ x, z, topY, rank: hashNoise(x, z, worldSeed, 157) });
    }
  }
  treeCandidates.sort((a, b) => a.rank - b.rank);
  const trees = [];
  for (const candidate of treeCandidates) {
    if (trees.some((tree) => Math.hypot(tree.x - candidate.x, tree.z - candidate.z) < 5)) continue;
    trees.push(candidate);
    if (trees.length === 4) break;
  }

  for (const tree of trees) {
    const trunkHeight = 3 + Math.floor(hashNoise(tree.x, tree.z, worldSeed, 181) * 2);
    for (let dy = 1; dy <= trunkHeight; dy += 1) {
      addBlock(tree.x, tree.topY + dy, tree.z, 'log');
    }
    for (let dy = trunkHeight - 1; dy <= trunkHeight + 1; dy += 1) {
      const radius = dy === trunkHeight + 1 ? 1 : 2;
      for (let dx = -radius; dx <= radius; dx += 1) {
        for (let dz = -radius; dz <= radius; dz += 1) {
          if (Math.abs(dx) === radius && Math.abs(dz) === radius && radius === 2) continue;
          addBlock(tree.x + dx, tree.topY + dy, tree.z + dz, 'leaves');
        }
      }
    }
  }

  const footprint = [];
  for (let dx = -1; dx <= 1; dx += 1) {
    for (let dz = -1; dz <= 1; dz += 1) {
      const x = buildingCenter.x + dx;
      const z = buildingCenter.z + dz;
      footprint.push({ x, z, topY: surfaces.get(columnKey(x, z)) });
    }
  }
  const floorY = Math.max(...footprint.map((cell) => cell.topY ?? WORLD_BOTTOM)) + 1;
  for (const cell of footprint) {
    if (cell.topY == null) continue;
    for (let y = cell.topY + 1; y <= floorY; y += 1) addBlock(cell.x, y, cell.z, 'brick');
  }
  for (let y = floorY + 1; y <= floorY + 2; y += 1) {
    for (let dx = -1; dx <= 1; dx += 1) {
      for (let dz = -1; dz <= 1; dz += 1) {
        const isWall = Math.abs(dx) === 1 || Math.abs(dz) === 1;
        const doorway = dz === 1 && dx === 0;
        if (isWall && !doorway) addBlock(buildingCenter.x + dx, y, buildingCenter.z + dz, 'planks');
      }
    }
  }
  for (let dx = -1; dx <= 1; dx += 1) {
    for (let dz = -1; dz <= 1; dz += 1) {
      addBlock(buildingCenter.x + dx, floorY + 3, buildingCenter.z + dz, 'planks');
    }
  }

  return blocks;
}

function findSpawnPoint() {
  return { x: 0, y: 0.5 + PLAYER_EYE_HEIGHT, z: 0 };
}


function stepVerticalPhysics({
  blocks,
  x,
  z,
  eyeY,
  verticalSpeed,
  delta,
  eyeHeight = PLAYER_EYE_HEIGHT,
  gravity = 19,
  radius = 0.3,
}) {
  const currentFeetY = eyeY - eyeHeight;
  const nextVerticalSpeed = verticalSpeed - gravity * delta;
  const nextEyeY = eyeY + nextVerticalSpeed * delta;
  const nextFeetY = nextEyeY - eyeHeight;

  if (nextVerticalSpeed > 0) {
    const ceilingBottom = blocks.reduce((lowest, block) => {
      const bottom = block.y - 0.5;
      const overlapsX = x + radius > block.x - 0.5 && x - radius < block.x + 0.5;
      const overlapsZ = z + radius > block.z - 0.5 && z - radius < block.z + 0.5;
      const crossesBottom = bottom >= eyeY - 1e-6 && bottom <= nextEyeY + 1e-6;
      return overlapsX && overlapsZ && crossesBottom ? Math.min(lowest, bottom) : lowest;
    }, Infinity);

    if (Number.isFinite(ceilingBottom)) {
      return { eyeY: ceilingBottom, verticalSpeed: 0, grounded: false };
    }
  }

  if (nextVerticalSpeed <= 0) {
    const landingTop = blocks.reduce((highest, block) => {
      const top = block.y + 0.5;
      const overlapsX = x + radius > block.x - 0.5 && x - radius < block.x + 0.5;
      const overlapsZ = z + radius > block.z - 0.5 && z - radius < block.z + 0.5;
      const crossesTop = top <= currentFeetY + 1e-6 && top >= nextFeetY - 1e-6;
      return overlapsX && overlapsZ && crossesTop ? Math.max(highest, top) : highest;
    }, -Infinity);

    if (Number.isFinite(landingTop)) {
      return { eyeY: landingTop + eyeHeight, verticalSpeed: 0, grounded: true };
    }
  }

  return { eyeY: nextEyeY, verticalSpeed: nextVerticalSpeed, grounded: false };
}

function resolvePlayerMovement({
  blocks,
  x,
  z,
  nextX,
  nextZ,
  eyeY,
  eyeHeight = PLAYER_EYE_HEIGHT,
  radius = 0.3,
}) {
  const feetY = eyeY - eyeHeight;
  const collides = (candidateX, candidateZ) => blocks.some((block) => {
    const blockBottom = block.y - 0.5;
    const blockTop = block.y + 0.5;
    const overlapsVertically = feetY < blockTop - 1e-6 && eyeY > blockBottom + 1e-6;
    const overlapsHorizontally =
      Math.abs(candidateX - block.x) < radius + 0.5 &&
      Math.abs(candidateZ - block.z) < radius + 0.5;
    return overlapsVertically && overlapsHorizontally;
  });

  const resolvedX = collides(nextX, z) ? x : nextX;
  const resolvedZ = collides(resolvedX, nextZ) ? z : nextZ;
  return { x: resolvedX, z: resolvedZ };
}

function findSafeSpawnPoint(blocks, preferred = findSpawnPoint(), radius = 0.3) {
  const candidates = blocks.filter((support) => {
    const feetY = support.y + 0.5;
    const eyeY = feetY + PLAYER_EYE_HEIGHT;
    return !blocks.some((block) => {
      const overlapsHorizontally =
        Math.abs(support.x - block.x) < radius + 0.5 &&
        Math.abs(support.z - block.z) < radius + 0.5;
      const overlapsVertically =
        feetY < block.y + 0.5 - 1e-6 &&
        eyeY > block.y - 0.5 + 1e-6;
      return overlapsHorizontally && overlapsVertically;
    });
  });

  candidates.sort((a, b) => {
    const aHorizontal = (a.x - preferred.x) ** 2 + (a.z - preferred.z) ** 2;
    const bHorizontal = (b.x - preferred.x) ** 2 + (b.z - preferred.z) ** 2;
    if (aHorizontal !== bHorizontal) return aHorizontal - bHorizontal;
    const aVertical = Math.abs(a.y + 0.5 + PLAYER_EYE_HEIGHT - preferred.y);
    const bVertical = Math.abs(b.y + 0.5 + PLAYER_EYE_HEIGHT - preferred.y);
    return aVertical - bVertical;
  });

  const support = candidates[0];
  if (!support) return preferred;
  return {
    x: support.x,
    y: support.y + 0.5 + PLAYER_EYE_HEIGHT,
    z: support.z,
  };
}

function createInitialPlayerState(blocks, preferred = findSpawnPoint(), clearance = 0) {
  let spawn = findSafeSpawnPoint(blocks, preferred);
  if (clearance > 0 && blocks.length > 0) {
    const highestBlockY = Math.max(...blocks.map((block) => block.y));
    const supports = blocks.filter((block) => block.y === highestBlockY);
    supports.sort((a, b) => {
      const aDistance = (a.x - preferred.x) ** 2 + (a.z - preferred.z) ** 2;
      const bDistance = (b.x - preferred.x) ** 2 + (b.z - preferred.z) ** 2;
      return aDistance - bDistance;
    });
    const highestSupport = supports[0];
    spawn = {
      x: highestSupport.x,
      y: highestSupport.y + 0.5 + PLAYER_EYE_HEIGHT,
      z: highestSupport.z,
    };
  }

  return {
    x: spawn.x,
    y: spawn.y + clearance,
    z: spawn.z,
    verticalSpeed: 0,
    grounded: clearance === 0,
  };
}

function respawnIfInVoid({ eyeY, verticalSpeed, spawn, voidY = -12 }) {
  if (eyeY >= voidY) return { eyeY, verticalSpeed, respawned: false };
  return { eyeY: spawn.y, verticalSpeed: 0, respawned: true };
}

function restoreWorldIfEmpty(blocks, seed) {
  return blocks.length === 0 ? createIslandBlocks(seed) : blocks;
}

function beginGame(onStart, requestPointerLock) {
  onStart();

  try {
    const result = requestPointerLock?.();
    if (result && typeof result.catch === 'function') result.catch(() => {});
  } catch {
    // 指標鎖定只是視角控制的輔助；瀏覽器拒絕時仍可開始遊戲。
  }
}

function shouldStartJump(keys, grounded) {
  return grounded && keys.has('Space');
}

function getMovementInput(keys) {
  return {
    forward: Number(keys.has('KeyW') || keys.has('ArrowUp')) -
      Number(keys.has('KeyS') || keys.has('ArrowDown')),
    sideways: Number(keys.has('KeyD') || keys.has('ArrowRight')) -
      Number(keys.has('KeyA') || keys.has('ArrowLeft')),
  };
}

const MINING_DURATIONS = Object.freeze({ grass: 0.8, dirt: 0.8, stone: 2 });

function getMiningDuration(type) {
  return MINING_DURATIONS[type] ?? MINING_DURATIONS.dirt;
}

function createMiningController() {
  let target = null;
  let elapsed = 0;

  return {
    update({ target: nextTarget, held, delta, type }) {
      if (!held || nextTarget == null) {
        target = null;
        elapsed = 0;
        return { target: null, progress: 0, stage: null, mined: false };
      }

      if (nextTarget !== target) {
        target = nextTarget;
        elapsed = 0;
      }

      const duration = getMiningDuration(type);
      elapsed = Math.min(elapsed + Math.max(0, delta), duration);
      const progress = elapsed / duration;
      return {
        target,
        progress,
        stage: Math.min(9, Math.floor(progress * 10)),
        mined: progress >= 1,
      };
    },
  };
}

const DROP_ITEM_SIZE = 0.3;
const DROP_ITEM_HALF_SIZE = DROP_ITEM_SIZE / 2;

const DROP_GRAVITY = 19;
const DROP_SPIN_SPEED = 1.8;

function createDroppedItem(block) {
  return {
    x: block.x,
    y: block.y + 0.5 + DROP_ITEM_HALF_SIZE,
    z: block.z,
    type: block.type,
    rotation: 0,
    verticalSpeed: 0,
    grounded: false,
  };
}

function stepDroppedItem(item, blocks, delta) {
  const elapsed = Math.max(0, delta);
  const nextVerticalSpeed = item.verticalSpeed - DROP_GRAVITY * elapsed;
  const nextY = item.y + nextVerticalSpeed * elapsed;
  const currentBottom = item.y - DROP_ITEM_HALF_SIZE;
  const nextBottom = nextY - DROP_ITEM_HALF_SIZE;
  const rotation = (item.rotation + DROP_SPIN_SPEED * elapsed) % (Math.PI * 2);

  if (nextVerticalSpeed <= 0) {
    const landingTop = blocks.reduce((highest, block) => {
      const top = block.y + 0.5;
      const overlapsX = item.x + DROP_ITEM_HALF_SIZE > block.x - 0.5 &&
        item.x - DROP_ITEM_HALF_SIZE < block.x + 0.5;
      const overlapsZ = item.z + DROP_ITEM_HALF_SIZE > block.z - 0.5 &&
        item.z - DROP_ITEM_HALF_SIZE < block.z + 0.5;
      const crossesTop = top <= currentBottom + 1e-6 && top >= nextBottom - 1e-6;
      return overlapsX && overlapsZ && crossesTop ? Math.max(highest, top) : highest;
    }, -Infinity);

    if (Number.isFinite(landingTop)) {
      return {
        ...item,
        y: landingTop + DROP_ITEM_HALF_SIZE,
        rotation,
        verticalSpeed: 0,
        grounded: true,
      };
    }
  }

  return {
    ...item,
    y: nextY,
    rotation,
    verticalSpeed: nextVerticalSpeed,
    grounded: false,
  };
}

const PICKUP_RADIUS = 1.5;

const PICKUP_SPEED = 5;
const PICKUP_ARRIVAL_DISTANCE = 0.12;

function stepPickupItem(item, player, delta) {
  const dx = player.x - item.x;
  const dy = player.y - item.y;
  const dz = player.z - item.z;
  const distance = Math.hypot(dx, dy, dz);
  const collecting = item.collecting || distance <= PICKUP_RADIUS;

  if (!collecting) return { item, collected: false };
  if (distance <= Math.max(PICKUP_SPEED * Math.max(0, delta), PICKUP_ARRIVAL_DISTANCE)) {
    return {
      item: { ...item, x: player.x, y: player.y, z: player.z, collecting: true },
      collected: true,
    };
  }

  const step = PICKUP_SPEED * Math.max(0, delta);
  const ratio = step / distance;
  return {
    item: {
      ...item,
      x: item.x + dx * ratio,
      y: item.y + dy * ratio,
      z: item.z + dz * ratio,
      collecting: true,
      grounded: false,
      verticalSpeed: 0,
    },
    collected: false,
  };
}

function addInventoryItem(inventory, type) {
  if (!Object.hasOwn(inventory, type)) return inventory;
  return { ...inventory, [type]: inventory[type] + 1 };
}

function stepInventorySelection(currentIndex, direction, slotCount) {
  if (!Number.isInteger(slotCount) || slotCount < 1) return 0;
  const current = Number.isInteger(currentIndex)
    ? ((currentIndex % slotCount) + slotCount) % slotCount
    : 0;
  return (current + Math.sign(direction) + slotCount) % slotCount;
}

function getInventoryIndexFromKey(code, slotCount) {
  const match = /^(?:Digit|Numpad)([1-9])$/.exec(code);
  if (!match) return null;
  const index = Number(match[1]) - 1;
  return index < slotCount ? index : null;
}

const DAY_SETTINGS = Object.freeze({
  background: '#bfe0f4',
  hemisphereIntensity: 2,
  sunIntensity: 2.2,
});
const NIGHT_SETTINGS = Object.freeze({
  background: '#17283e',
  hemisphereIntensity: 1.05,
  sunIntensity: 0.85,
});

function isDayNightToggleKey(code) {
  return code === 'KeyN';
}

function createDayNightController() {
  let isNight = false;
  return {
    get isNight() { return isNight; },
    get settings() { return { ...(isNight ? NIGHT_SETTINGS : DAY_SETTINGS) }; },
    toggle() {
      isNight = !isNight;
      return isNight;
    },
  };
}

function tryPlaceBlock({ blocks, source, normal, type, inventory }) {
  const amount = inventory[type];
  const axisValues = [normal?.x, normal?.y, normal?.z];
  const isFaceNormal = axisValues.filter((value) => value === 1 || value === -1).length === 1 &&
    axisValues.every((value) => value === 0 || value === 1 || value === -1);
  if (!Object.hasOwn(inventory, type) || amount <= 0 || !isFaceNormal) {
    return { blocks, inventory, placed: false, position: null };
  }
  const position = {
    x: source.x + normal.x,
    y: source.y + normal.y,
    z: source.z + normal.z,
  };
  if (!isWithinWorldBounds(position.x, position.y, position.z) ||
      blocks.some((block) =>
        block.x === position.x && block.y === position.y && block.z === position.z,
      )) {
    return { blocks, inventory, placed: false, position };
  }
  return {
    blocks: [...blocks, { ...position, type }],
    inventory: { ...inventory, [type]: amount - 1 },
    placed: true,
    position,
  };
}


const game = document.querySelector('#game');
const startButton = document.querySelector('#start');
const errorBox = document.querySelector('#error');
const fpsLabel = document.querySelector('#fps');

try {
  startGame();
} catch (error) {
  errorBox.hidden = false;
  errorBox.textContent = `遊戲載入失敗：${error.message}`;
  throw error;
}

function startGame() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#bfe0f4');

  const worldSeed = Math.floor(Math.random() * 0xffffffff) >>> 0;
  const blocks = createIslandBlocks(worldSeed);
  const spawn = findSafeSpawnPoint(blocks, findSpawnPoint());
  const initialPlayer = createInitialPlayerState(blocks, spawn, 0.1);

  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(initialPlayer.x, initialPlayer.y - CAMERA_VIEW_OFFSET, initialPlayer.z);

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  game.prepend(renderer.domElement);

  const hemisphereLight = new THREE.HemisphereLight(0xe8f6ff, 0x68604e, 2.0);
  scene.add(hemisphereLight);
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-8, 18, 10);
  scene.add(sun);
  const dayNight = createDayNightController();
  const applyDayNightSettings = () => {
    const settings = dayNight.settings;
    scene.background.set(settings.background);
    hemisphereLight.intensity = settings.hemisphereIntensity;
    sun.intensity = settings.sunIntensity;
  };
  const toggleDayNight = () => {
    dayNight.toggle();
    applyDayNightSettings();
  };
  applyDayNightSettings();

  const loader = new THREE.TextureLoader();
  const texture = (name) => {
    const map = loader.load(INLINE_TEXTURES[name]);
    map.colorSpace = THREE.SRGBColorSpace;
    map.magFilter = THREE.NearestFilter;
    map.minFilter = THREE.NearestFilter;
    return map;
  };
  const grassTop = texture('grass_top');
  const grassSide = texture('grass_side');
  const dirt = texture('dirt');
  const stone = texture('stone');
  const sand = texture('sand');
  const brick = texture('brick');
  const planks = texture('planks');
  const logTop = texture('log_top');
  const logSide = texture('log_side');
  const leaves = texture('leaves');
  const grassMaterials = [
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassTop }),
    new THREE.MeshLambertMaterial({ map: dirt }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
    new THREE.MeshLambertMaterial({ map: grassSide }),
  ];
  const materials = {
    grass: grassMaterials,
    dirt: new THREE.MeshLambertMaterial({ map: dirt }),
    stone: new THREE.MeshLambertMaterial({ map: stone }),
    sand: new THREE.MeshLambertMaterial({ map: sand }),
    brick: new THREE.MeshLambertMaterial({ map: brick }),
    planks: new THREE.MeshLambertMaterial({ map: planks }),
    log: [logSide, logSide, logTop, logTop, logSide, logSide].map((map) =>
      new THREE.MeshLambertMaterial({ map }),
    ),
    leaves: new THREE.MeshLambertMaterial({ map: leaves, transparent: true, alphaTest: 0.5 }),
  };

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const transform = new THREE.Object3D();
  const blockMeshes = [];
  for (const type of BLOCK_TYPES) {
    const positions = blocks.filter((block) => block.type === type);
    const mesh = new THREE.InstancedMesh(geometry, materials[type], positions.length);
    positions.forEach((block, index) => {
      transform.position.set(block.x, block.y, block.z);
      transform.updateMatrix();
      mesh.setMatrixAt(index, transform.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.userData.blockPositions = positions;
    mesh.userData.blockPositionsType = type;
    blockMeshes.push(mesh);
    scene.add(mesh);
  }

  const dropGeometry = new THREE.BoxGeometry(DROP_ITEM_SIZE, DROP_ITEM_SIZE, DROP_ITEM_SIZE);
  const droppedItems = [];
  const inventoryLabels = Object.fromEntries(BLOCK_TYPES.map((type) => [
    type,
    document.querySelector(`#count-${type}`),
  ]));
  const inventoryIcons = Object.fromEntries(BLOCK_TYPES.map((type) => [
    type,
    document.querySelector(`#icon-${type}`),
  ]));
  const inventorySlots = [...document.querySelectorAll('.inventory-slot')];
  let inventory = Object.fromEntries(BLOCK_TYPES.map((type) => [type, 0]));
  let selectedInventoryIndex = 0;

  const updateInventorySelection = () => {
    inventorySlots.forEach((slot, index) => {
      const selected = index === selectedInventoryIndex;
      slot.classList.toggle('selected', selected);
      slot.setAttribute('aria-selected', String(selected));
    });
  };
  updateInventorySelection();

  const crackMaterials = Array.from({ length: 10 }, (_, stage) => {
    const map = texture(`destroy_stage_${stage}`);
    return new THREE.MeshBasicMaterial({
      map,
      transparent: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
    });
  });
  const crackOverlay = new THREE.Mesh(new THREE.BoxGeometry(1.006, 1.006, 1.006), crackMaterials);
  crackOverlay.visible = false;
  scene.add(crackOverlay);
  const raycaster = new THREE.Raycaster();
  const screenCenter = new THREE.Vector2(0, 0);
  const mining = createMiningController();

  const keys = new Set();
  let yaw = 0;
  let pitch = 0;
  let verticalSpeed = initialPlayer.verticalSpeed;
  let grounded = initialPlayer.grounded;
  let playerEyeY = initialPlayer.y;
  let gameStarted = false;
  let miningHeld = false;
  let lastTime = performance.now();
  let fpsFrames = 0;
  let fpsStart = lastTime;
  const eyeHeight = PLAYER_EYE_HEIGHT;

  window.addEventListener('keydown', (event) => {
    if (isDayNightToggleKey(event.code)) {
      event.preventDefault();
      if (!event.repeat) toggleDayNight();
      return;
    }
    const inventoryIndex = getInventoryIndexFromKey(event.code, inventorySlots.length);
    if (inventoryIndex != null) {
      event.preventDefault();
      selectedInventoryIndex = inventoryIndex;
      updateInventorySelection();
      return;
    }
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
    keys.add(event.code);
  });
  window.addEventListener('wheel', (event) => {
    if (event.deltaY === 0) return;
    selectedInventoryIndex = stepInventorySelection(
      selectedInventoryIndex,
      Math.sign(event.deltaY),
      inventorySlots.length,
    );
    updateInventorySelection();
  }, { passive: true });
  window.addEventListener('keyup', (event) => keys.delete(event.code));
  window.addEventListener('blur', () => {
    keys.clear();
    miningHeld = false;
  });
  renderer.domElement.addEventListener('mousedown', (event) => {
    if (event.button === 0) miningHeld = true;
    if (event.button === 2) {
      event.preventDefault();
      if (gameStarted) placeTargetedBlock();
    }
  });
  renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());
  window.addEventListener('mouseup', (event) => {
    if (event.button === 0) miningHeld = false;
  });

  const enterGame = () => beginGame(
    () => {
      gameStarted = true;
      startButton.hidden = true;
    },
    () => {
      if (document.pointerLockElement !== renderer.domElement) {
        return renderer.domElement.requestPointerLock?.();
      }
      return undefined;
    },
  );
  renderer.domElement.addEventListener('click', enterGame);
  startButton.addEventListener('click', enterGame);
  document.addEventListener('mousemove', (event) => {
    const isPointerLocked = document.pointerLockElement === renderer.domElement;
    if (!gameStarted || (!isPointerLocked && event.target !== renderer.domElement)) return;
    yaw -= event.movementX * 0.002;
    pitch = THREE.MathUtils.clamp(pitch - event.movementY * 0.002, -1.45, 1.45);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
  });

  function updatePlayer(delta) {
    if (shouldStartJump(keys, grounded)) {
      verticalSpeed = 7.1;
      grounded = false;
    }
    const { forward, sideways } = getMovementInput(keys);
    const length = Math.hypot(forward, sideways) || 1;
    const speed = 5.2 * delta / length;
    const nextX = camera.position.x + (sideways * Math.cos(yaw) - forward * Math.sin(yaw)) * speed;
    const nextZ = camera.position.z + (-sideways * Math.sin(yaw) - forward * Math.cos(yaw)) * speed;
    const blocks = blockMeshes.flatMap((mesh) => mesh.userData.blockPositions);
    const movement = resolvePlayerMovement({
      blocks,
      x: camera.position.x,
      z: camera.position.z,
      nextX: THREE.MathUtils.clamp(nextX, -15.5, 15.5),
      nextZ: THREE.MathUtils.clamp(nextZ, -15.5, 15.5),
      eyeY: playerEyeY,
      eyeHeight,
    });
    camera.position.x = movement.x;
    camera.position.z = movement.z;

    const physics = stepVerticalPhysics({
      blocks,
      x: camera.position.x,
      z: camera.position.z,
      eyeY: playerEyeY,
      verticalSpeed,
      delta,
      eyeHeight,
    });
    playerEyeY = physics.eyeY;
    camera.position.y = playerEyeY - CAMERA_VIEW_OFFSET;
    verticalSpeed = physics.verticalSpeed;
    grounded = physics.grounded;

    const respawn = respawnIfInVoid({
      eyeY: playerEyeY,
      verticalSpeed,
      spawn,
    });
    if (respawn.respawned) {
      const safeSpawn = findSafeSpawnPoint(blocks, spawn);
      playerEyeY = safeSpawn.y;
      camera.position.set(safeSpawn.x, playerEyeY - CAMERA_VIEW_OFFSET, safeSpawn.z);
      verticalSpeed = respawn.verticalSpeed;
      grounded = true;
    }
  }

  function updateDroppedItems(delta) {
    const blocks = blockMeshes.flatMap((mesh) => mesh.userData.blockPositions);
    const player = {
      x: camera.position.x,
      y: playerEyeY - eyeHeight * 0.55,
      z: camera.position.z,
    };
    for (let index = droppedItems.length - 1; index >= 0; index -= 1) {
      const item = droppedItems[index];
      const fallingState = item.state.collecting
        ? item.state
        : stepDroppedItem(item.state, blocks, delta);
      const pickup = stepPickupItem(fallingState, player, delta);
      item.state = pickup.item;

      if (pickup.collected) {
        inventory = addInventoryItem(inventory, item.state.type);
        inventoryLabels[item.state.type].textContent = String(inventory[item.state.type]);
        inventoryLabels[item.state.type].hidden = false;
        inventoryIcons[item.state.type].hidden = false;
        scene.remove(item.mesh);
        droppedItems.splice(index, 1);
        continue;
      }

      item.mesh.position.set(item.state.x, item.state.y, item.state.z);
      item.mesh.rotation.set(item.state.rotation * 0.7, item.state.rotation, 0);
    }
  }

  function placeTargetedBlock() {
    raycaster.setFromCamera(screenCenter, camera);
    const hit = raycaster.intersectObjects(blockMeshes, false)[0];
    if (!hit || !Number.isInteger(hit.instanceId) || !hit.face) return;
    const source = hit.object.userData.blockPositions[hit.instanceId];
    if (!source) return;

    const type = BLOCK_TYPES[selectedInventoryIndex];
    const blocks = blockMeshes.flatMap((mesh) => mesh.userData.blockPositions);
    const result = tryPlaceBlock({ blocks, source, normal: hit.face.normal, type, inventory });
    if (!result.placed) return;

    inventory = result.inventory;
    const count = inventoryLabels[type];
    const icon = inventoryIcons[type];
    const hasItems = inventory[type] > 0;
    count.textContent = String(inventory[type]);
    count.hidden = !hasItems;
    icon.hidden = !hasItems;
    addPlacedBlockToMesh(result.blocks[result.blocks.length - 1]);
  }

  function addPlacedBlockToMesh(block) {
    const meshIndex = blockMeshes.findIndex((mesh) => mesh.userData.blockPositionsType === block.type);
    const mesh = blockMeshes[meshIndex];
    const positions = mesh.userData.blockPositions;
    positions.push(block);
    if (positions.length > mesh.instanceMatrix.count) {
      const expanded = new THREE.InstancedMesh(geometry, materials[block.type], positions.length);
      positions.forEach((position, index) => {
        transform.position.set(position.x, position.y, position.z);
        transform.updateMatrix();
        expanded.setMatrixAt(index, transform.matrix);
      });
      expanded.instanceMatrix.needsUpdate = true;
      expanded.userData.blockPositions = positions;
      expanded.userData.blockPositionsType = block.type;
      scene.remove(mesh);
      blockMeshes[meshIndex] = expanded;
      scene.add(expanded);
      return;
    }
    transform.position.set(block.x, block.y, block.z);
    transform.updateMatrix();
    mesh.setMatrixAt(positions.length - 1, transform.matrix);
    mesh.count = positions.length;
    mesh.instanceMatrix.needsUpdate = true;
    mesh.computeBoundingSphere();
  }

  function updateMining(delta) {
    raycaster.setFromCamera(screenCenter, camera);
    const hit = miningHeld && gameStarted
      ? raycaster.intersectObjects(blockMeshes, false)[0]
      : null;
    const mesh = hit?.object ?? null;
    const instanceId = hit?.instanceId;
    const block = mesh && Number.isInteger(instanceId)
      ? mesh.userData.blockPositions[instanceId]
      : null;
    const result = mining.update({
      target: block ? `${block.x},${block.y},${block.z}` : null,
      held: miningHeld && gameStarted,
      delta,
      type: block?.type,
    });

    if (!block || result.stage == null) {
      crackOverlay.visible = false;
      return;
    }

    crackOverlay.position.set(block.x, block.y, block.z);
    crackOverlay.material = crackMaterials[result.stage];
    crackOverlay.visible = true;
    if (result.mined) {
      const positions = mesh.userData.blockPositions;
      const lastIndex = positions.length - 1;
      if (instanceId !== lastIndex) {
        const lastBlock = positions[lastIndex];
        transform.position.set(lastBlock.x, lastBlock.y, lastBlock.z);
        transform.updateMatrix();
        mesh.setMatrixAt(instanceId, transform.matrix);
        positions[instanceId] = lastBlock;
      }
      positions.pop();
      mesh.count = positions.length;
      mesh.instanceMatrix.needsUpdate = true;
      mesh.computeBoundingSphere();
      crackOverlay.visible = false;
      mining.update({ target: null, held: false, delta: 0, type: block.type });
      const droppedState = createDroppedItem(block);
      const droppedMesh = new THREE.Mesh(dropGeometry, materials[block.type]);
      droppedMesh.position.set(droppedState.x, droppedState.y, droppedState.z);
      scene.add(droppedMesh);
      droppedItems.push({ state: droppedState, mesh: droppedMesh });
      if (blockMeshes.every((blockMesh) => blockMesh.userData.blockPositions.length === 0)) {
        const restored = restoreWorldIfEmpty([], worldSeed);
        for (const blockMesh of blockMeshes) {
          const positions = restored.filter((restoredBlock) => restoredBlock.type === blockMesh.userData.blockPositionsType);
          blockMesh.userData.blockPositions.splice(0, blockMesh.userData.blockPositions.length, ...positions);
          positions.forEach((restoredBlock, index) => {
            transform.position.set(restoredBlock.x, restoredBlock.y, restoredBlock.z);
            transform.updateMatrix();
            blockMesh.setMatrixAt(index, transform.matrix);
          });
          blockMesh.count = positions.length;
          blockMesh.instanceMatrix.needsUpdate = true;
          blockMesh.computeBoundingSphere();
        }
        playerEyeY = spawn.y;
        camera.position.set(spawn.x, playerEyeY - CAMERA_VIEW_OFFSET, spawn.z);
        verticalSpeed = 0;
        grounded = true;
      }
    }
  }

  function animate(now) {
    requestAnimationFrame(animate);
    const delta = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    updatePlayer(delta);
    updateDroppedItems(delta);
    updateMining(delta);
    renderer.render(scene, camera);
    fpsFrames += 1;
    if (now - fpsStart >= 1000) {
      fpsLabel.textContent = `${Math.round(fpsFrames * 1000 / (now - fpsStart))} FPS`;
      fpsFrames = 0;
      fpsStart = now;
    }
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

    </script>
  </body>
