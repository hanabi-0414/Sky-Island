<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#bfe0f4" />
    <title>空中之島</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main id="game" aria-label="空中之島遊戲">
      <div id="hud">
        <div class="brand">空中之島</div>
        <div class="controls">WASD 移動・空白鍵跳躍・滑鼠轉向</div>
        <div id="fps" aria-live="off">-- FPS</div>
      </div>
      <div id="crosshair" aria-hidden="true">+</div>
      <div id="inventory" aria-label="方塊欄">
        <div class="inventory-slot"><img class="inventory-icon" id="icon-grass" src="./assets/sky-island-assets/icons/grass.png" alt="草地" hidden><span id="count-grass" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-dirt" src="./assets/sky-island-assets/icons/dirt.png" alt="泥土" hidden><span id="count-dirt" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-stone" src="./assets/sky-island-assets/icons/stone.png" alt="石頭" hidden><span id="count-stone" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-sand" src="./assets/sky-island-assets/icons/sand.png" alt="沙子" hidden><span id="count-sand" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-brick" src="./assets/sky-island-assets/icons/brick.png" alt="磚塊" hidden><span id="count-brick" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-planks" src="./assets/sky-island-assets/icons/planks.png" alt="木材" hidden><span id="count-planks" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-log" src="./assets/sky-island-assets/icons/log.png" alt="原木" hidden><span id="count-log" hidden>0</span></div>
        <div class="inventory-slot"><img class="inventory-icon" id="icon-leaves" src="./assets/sky-island-assets/icons/leaves.png" alt="樹葉" hidden><span id="count-leaves" hidden>0</span></div>
      </div>
      <button id="start" type="button">點擊畫面開始</button>
      <div id="error" role="alert" hidden></div>
    </main>
  </body>
</html>
